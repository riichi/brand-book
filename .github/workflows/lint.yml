name: "Lint"

on: push

permissions: {}

jobs:
  prek:
    name: Run prek
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run prek
        uses: j178/prek-action@v3.1.1

  verify-lockfile:
    name: Verify actions.lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.5.1

      - name: Verify lockfile
        run: gh actions-lock --verify
