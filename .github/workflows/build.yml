name: "Build PDF"

on: push

permissions: {}

jobs:
  build:
    name: Build PDF
    runs-on: ubuntu-latest
    permissions:
      contents: write # create releases
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Typst
        uses: typst-community/setup-typst@v5.3.2

      - name: Compile document
        run: typst compile --font-path fonts ksiega.typ

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ksiega-znaku
          path: |
            ksiega.pdf

      - name: Create release (on push to a tag named "release-*")
        if: startsWith(github.ref, 'refs/tags/release-')
        run: |
          zip -r ksiega-znaku.zip ksiega.pdf assets LICENSE
          gh release create "$GITHUB_REF_NAME" ksiega.pdf ksiega-znaku.zip
        env:
          GH_TOKEN: ${{ github.token }}
